# Phase 161e, 5 November 2026 (the ITRoadway audit, section 5): every pull request is checked on a fresh copy.
#
# A fresh checkout on Node 24 runs what the Mac runs before every commit: the back end's `npm run check` (the live
# package audit, the SQL, path and copies checks, the type check and the back-end tests), the site harness in both
# modes, the phase3 and phase9 suites, and an audit of the root package.json the test website installs.
#
# Tests that read a document kept in OneDrive only (never in git) skip here and say why, by name, in the output.
# Lakhbir merges a pull request only when this is green.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: A fresh copy passes every check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/London
    steps:
      # L-08: pinned to its commit. The comment holds the version and nothing else, so Dependabot keeps it true
      # when it moves the commit (Phase 163 found "# v4.4.0" left beside v7.0.1's commit when words followed it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Caprebate/09-app/backend/package-lock.json

      - name: Install the back end (npm ci)
        working-directory: Caprebate/09-app/backend
        run: npm ci --no-fund

      - name: The back end - npm run check (audit, lint, types, tests)
        working-directory: Caprebate/09-app/backend
        run: npm run check

      # Phase 161h1, 7 November 2026: the boundary check runs inside npm run check above; here its self-test proves a
      # planted break of each rule still turns it red (09-app/docs/ARCHITECTURE.md, the ratchet).
      - name: The boundary check's own controls
        working-directory: Caprebate/09-app/backend
        run: node tools/boundaries.cjs --self-test

      # Phase 161f, 5 November 2026: the calculator is edited in engine/src and the page is built from it. The page (and
      # the back end's copy) must carry exactly the built calculator, and a planted edit in the page must turn it red.
      - name: The page carries exactly the built calculator
        working-directory: Caprebate/09-app/engine
        run: |
          node tools/verify-page.cjs
          node tools/verify-page.cjs --self-test
          node tools/build.cjs --check

      - name: The site harness
        working-directory: Caprebate
        run: node 03-app/caprebate-regression.cjs

      - name: The site harness, against the package
        working-directory: Caprebate
        run: node 03-app/caprebate-regression.cjs --package

      - name: The phase3 suite
        working-directory: Caprebate/04-phase-work/phase3
        run: node --test

      - name: The phase9 suite
        working-directory: Caprebate/04-phase-work/phase9
        run: node --test

      # The root package.json is what Vercel installs for both websites. Since Phase 161n1e (ITRoadway's second
      # review, M-05) its lock file is committed and Vercel installs exactly it (npm ci --omit=dev, vercel.ts), so this
      # audits the very lock the websites are built from, installed the same way.
      - name: The root package - npm ci and npm audit (high and above), from the committed lock
        run: |
          npm ci --omit=dev --no-fund --no-audit
          npm audit --omit=dev --audit-level=high
